<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
<div class="card p-4 shadow-lg" style="width: 400px;">
    <h2 class="text-center mb-4">Login</h2>
    <form action="/start/login" method="post" id="login_form">
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
        Invalid username or password
    </div>
    <div th:if="${param.logout}" class="alert alert-success mt-3" role="alert">
        You have been logged out successfully.
    </div>
    <div th:if="${param.info}" class="alert alert-success mt-3" role="alert">
        منتظر تایید حساب کاربری خود باشید
    </div>
</div>
</body>
<script>
    document.getElementById("login_form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;


        const loginForm = {
            username : username,
            password : password
        }

        const response = await fetch("/start/login", {
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            method: "POST",
            body: loginForm
        });
        console.log(await response.json());
        if (response.ok) {
            const data = await response.json(); // دریافت داده‌ها به صورت asynchronous
            console.log(data); // چاپ داده‌ها برای بررسی

            const token = data.token;
            const role = data.role;
            console.log("Token: ", token);
            console.log("Role: ", role);

            // ذخیره توکن در localStorage
            localStorage.setItem("token", token);

            // ارسال توکن به سرور قبل از ریدایرکت
            const redirectUrl = role === "ROLE_ADMIN" ? "/admin" :
                role === "ROLE_TEACHER" ? "/teacher" :
                    role === "ROLE_STUDENT" ? "/student" : "/start/login";

            const redirectResponse = await fetch(redirectUrl, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}` // ارسال توکن در هدر
                }
            });

            if (redirectResponse.ok) {
                console.log("Redirecting to:", redirectUrl);
                // ریدایرکت به صفحه مربوطه
                window.location.assign(redirectUrl);
            } else {
                console.error("Error in redirect request");
                alert("Redirect failed, please try again.");
            }
        } else {
            alert('Login failed: ' + response.statusText);
        }
    });


</script>
</html>
